    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" rel="stylesheet" />
    <link href="static/css/styles.css" rel="stylesheet" />
    <link href="static/css/main.css" rel="stylesheet" />

    <script defer src="static/js/bootstrap.bundle.min.js"></script>

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>

<body class="page-article">
    <div class="scroll-progress-track">
        <div id="scrollProgress" class="scroll-progress"></div>
    </div>

    <nav class="navbar navbar-expand-lg site-header fixed-top" id="mainNav">
        <div class="container px-4 px-lg-5">
            <a class="navbar-brand" href="index.html" data-config="page-top-title">hellocccl</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive"
                aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
                <i class="bi bi-list"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                    <li class="nav-item"><a class="nav-link" href="index.html#home">about</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#interests">focus</a></li>

                    <li class="nav-item"><a class="nav-link active" href="blog.html">posts</a></li>
                    <li class="nav-item">
                        <button class="theme-toggle-btn" type="button" data-theme-toggle aria-label="Toggle theme">
                            <i class="bi bi-moon-stars-fill"></i>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="page-main">
        <section class="page-hero article-hero">
            <div class="container px-4 px-lg-5">
                <a class="back-link" href="blog.html">
                    <i class="bi bi-arrow-left"></i>
                    <span>Back to posts</span>
                </a>

                <div class="article-hero-copy">
                    <span class="section-kicker">ARTICLE</span>
                    <h1 id="article-heading">Loading...</h1>
                    <p id="article-description">Loading article content.</p>
                </div>

                <div class="article-meta" id="article-meta">
                    <span class="meta-pill"><i class="bi bi-calendar3"></i><strong id="article-date">-</strong></span>
                    <span class="meta-pill"><i class="bi bi-file-earmark-text"></i><strong id="word-count">0</strong> words</span>
                    <span class="meta-pill"><i class="bi bi-clock"></i><strong id="read-time">0</strong> min</span>
                    <span class="meta-pill"><i class="bi bi-eye"></i><strong id="article-views">0</strong> views</span>
                </div>

                <div class="tag-list article-tag-list" id="article-tags"></div>
            </div>
        </section>

        <section class="section-block article-layout-section">
            <div class="container px-4 px-lg-5">
                <div class="article-layout">
                    <aside class="article-sidebar">
                        <div class="sidebar-card sticky-card">
                            <div class="section-heading compact">
                                <span class="section-kicker">OUTLINE</span>
                                <h2>Contents</h2>
                            </div>
                            <nav id="article-toc"></nav>
                        </div>
                    </aside>

                    <div class="article-main">
                        <article class="content-card prose-card article-prose" id="article-content">
                            <div class="empty-state">
                                <i class="bi bi-hourglass-split"></i>
                                <h3>Loading article</h3>
                                <p>Just a moment.</p>
                            </div>
                        </article>

                        <section class="related-section">
                            <div class="section-heading">
                                <span class="section-kicker">MORE</span>
                                <h2>Related posts</h2>
                                <p>Keep reading around the same topics.</p>
                            </div>
                            <div class="article-grid compact-grid" id="related-articles"></div>
                        </section>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container px-4 px-lg-5">
            <div class="footer-inner">
                <div>
                    <div class="footer-title" data-config="page-top-title">hellocccl</div>
                    <p class="footer-text" data-config="copyright-text"></p>
                </div>
                <div class="footer-meta">
                    <span><i class="bi bi-bar-chart-line"></i> Visits <strong data-site-visits>0</strong></span>
                    <a data-config="github-url" data-config-attr="href" href="https://github.com/hellocccl">
                        <span data-config="github-label">Github</span>
                    </a>
                    <a data-config="license-url" data-config-attr="href" href="https://github.com/hellocccl/hellocccl.github.io/blob/main/LICENSE">
                        <span data-config="license-label">License</span>
                    </a>
                </div>
            </div>
        </div>
    </footer>

    <button id="backToTop" class="back-to-top" type="button" aria-label="Back to top">
        <i class="bi bi-arrow-up"></i>
    </button>
